<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>امتیاز دوومیدانی</title>
  <meta name="theme-color" content="#08192f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="امتیاز دوومیدانی" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <div class="track-bg" aria-hidden="true"></div>
  <div class="app">
    <header class="hero">
      <div class="brand-lockup">
        <svg class="logo-img" viewBox="0 0 128 128" aria-hidden="true">
          <defs>
            <linearGradient id="logoGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffe08a"/>
              <stop offset="1" stop-color="#d4a017"/>
            </linearGradient>
            <linearGradient id="logoTrack" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff4d5a"/>
              <stop offset="1" stop-color="#b50e2a"/>
            </linearGradient>
          </defs>
          <circle cx="64" cy="64" r="62" fill="#08192f"/>
          <circle cx="64" cy="64" r="56" fill="url(#logoGold)"/>
          <circle cx="64" cy="64" r="50" fill="#08192f"/>
          <ellipse cx="64" cy="68" rx="34" ry="18" fill="none" stroke="url(#logoTrack)" stroke-width="10"/>
          <ellipse cx="64" cy="68" rx="34" ry="18" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="6 7" opacity=".9"/>
          <path d="M46 86c8-16 14-28 32-42" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <circle cx="80" cy="42" r="6" fill="#ffe08a"/>
          <path d="M38 96h52" stroke="#ffe08a" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>محاسبه امتیاز</h1>
        </div>
      </div>
      <div class="hero-medals" aria-hidden="true">
        <span class="medal gold"></span>
        <span class="medal silver"></span>
        <span class="medal bronze"></span>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button type="button" class="tab is-active" data-tab="entry">ثبت</button>
      <button type="button" class="tab" data-tab="table">جدول</button>
    </nav>

    <div id="entryPanel">
      <section class="athlete">
        <span class="athlete-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.4-4 4-6 7-6s5.6 2 7 6"/></svg>
        </span>
        <div class="athlete-name">
          <label for="athlete">ورزشکار</label>
          <input id="athlete" type="text" list="athleteList" placeholder="نام و نام خانوادگی" autocomplete="name" />
          <datalist id="athleteList"></datalist>
        </div>
        <div class="date-field">
          <label for="recordDate">تاریخ</label>
          <input id="recordDate" type="date" />
        </div>
      </section>

      <section class="grid" id="events"></section>
    </div>

    <div id="tablePanel" hidden>
      <div class="tables" id="historyTable"></div>
    </div>
  </div>

  <footer class="dock">
    <div class="dock-score">
      <span class="dock-label">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8" r="5" fill="#ffe08a"/><path d="M8 13h8l-1.2 8H9.2z" fill="#ffe08a"/></svg>
        جمع امتیاز
      </span>
      <strong id="totalScore">—</strong>
    </div>
    <div class="dock-actions">
      <button type="button" id="saveBtn">ثبت</button>
      <button type="button" id="resetBtn">شروع دوباره</button>
    </div>
  </footer>

  <script src="app.js?v=10"></script>
</body>
</html>
